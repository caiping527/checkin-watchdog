name: 签到巡检（只查有没有运行）

on:
  schedule:
    # UTC 11:00 = 北京时间 19:00。
    # 五个项目 cron 名义在 08:05~10:35，但 GitHub 定时排队常延迟 5~8 小时，
    # 实际跑完约 13:45~18:10（天翼云盘最晚），所以不能早于 18:30 检查。
    # Healthchecks 的 check 必须用同一个 cron，两边不一致会天天误报。
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: '发一条测试告警到手机（验证推送通道）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: 检查各项目今天有没有运行
        env:
          WATCH_PAT: ${{ secrets.WATCH_PAT }}
          WECOM_APP: ${{ secrets.WECOM_APP }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          WATCH_FORCE_ALERT: ${{ inputs.force_alert }}
          WATCH_STALE_QUEUED_MIN: '90'
        run: python3 watchdog.py
