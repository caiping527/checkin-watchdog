# 月度空提交：给仓库留一条活动记录，降低 scheduled workflow
# 因「长期无仓库活动」被 GitHub 自动停用的风险。
# 巡检仓库是唯一没有别人能替它兜底的仓库，所以自带保活。
name: Keepalive

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
